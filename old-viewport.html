<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=50&id=21812&format=png">

    <title>Rich Text to Markdown Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <style>
        /* Estilização para a área de entrada editável */
        #input-area:empty:before {
            content: attr(data-placeholder);
            color: #9ca3af;
        }
        #input-area {
            outline: none;
        }

        /* Barra de deslocamento personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Ajuste para ocupar a altura total */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toast acessível */
        #toast {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 200ms ease, transform 200ms ease;
            pointer-events: none;
        }
        #toast.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Indicador de processamento leve */
        #output-area.processing {
            opacity: 0.5;
            transition: opacity 120ms ease;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <div class="main-container max-w-[1600px] mx-auto px-4 py-4 md:py-6">
        <header class="mb-4 border-b border-slate-200 dark:border-slate-800 pb-4 shrink-0 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 dark:text-blue-400"><path d="M4 7V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M9 12l-3 3 3 3"/><path d="M15 12l3 3-3 3"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
                    RTF to Markdown Engine
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Conversão estrutural para Markdown Puro (GFM).</p>
            </div>
            
            <!-- Botão Alternar Tema -->
            <button id="theme-toggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:ring-2 ring-blue-500 transition-all" aria-label="Alternar Tema">
                <svg id="sun-icon" class="hidden dark:block" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg id="moon-icon" class="block dark:hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow overflow-hidden mb-4">
            <!-- Coluna de Entrada (Rich Text) -->
            <section class="flex flex-col gap-2 overflow-hidden h-full">
                <div class="flex items-center justify-between shrink-0">
                    <label class="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2 text-sm">
                        <span>1. Entrada (Cole Conteúdo Rico)</span>
                    </label>
                    <button id="clear-btn" class="text-[10px] text-red-500 hover:underline uppercase font-bold tracking-wider" aria-label="Limpar entrada">
                        Limpar
                    </button>
                </div>
                <div 
                    id="input-area" 
                    contenteditable="true" 
                    role="textbox"
                    aria-multiline="true"
                    aria-label="Área de entrada de texto rico"
                    data-placeholder="Cole aqui textos do Word, Navegador ou Editores..."
                    class="bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-sm focus:border-blue-500 dark:focus:border-blue-400 transition-colors overflow-y-auto h-full text-slate-800 dark:text-slate-200"
                ></div>
            </section>

            <!-- Coluna de Saída (Markdown) -->
            <section class="flex flex-col gap-2 overflow-hidden h-full">
                <div class="flex items-center justify-between shrink-0">
                    <label class="font-semibold text-slate-700 dark:text-slate-300 text-sm">2. Saída (Markdown Sanitizado)</label>
                    <button id="copy-btn" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-700 transition-all flex items-center gap-2" aria-label="Copiar Markdown">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Copiar MD
                    </button>
                </div>
                <div class="relative h-full overflow-hidden">
                    <textarea 
                        id="output-area" 
                        readonly
                        aria-readonly="true"
                        aria-label="Saída em formato Markdown"
                        placeholder="O código Markdown aparecerá aqui..."
                        class="w-full h-full bg-slate-900 dark:bg-black text-slate-100 font-mono text-sm p-6 rounded-xl shadow-inner border border-slate-800 dark:border-slate-700 resize-none focus:ring-0"
                    ></textarea>
                </div>
            </section>
        </main>

        <!-- Status e Estatísticas -->
        <footer class="shrink-0 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-3 flex flex-wrap gap-6 text-xs text-slate-500 dark:text-slate-400">
            <div id="char-count">Caracteres: 0</div>
            <div id="word-count">Palavras: 0</div>
            <div id="theme-label" class="ml-auto italic">🌙 Modo Escuro</div>
        </footer>
    </div>

    <!-- Mensagem de Feedback -->
    <div id="toast" role="status" aria-live="polite" aria-atomic="true" class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-slate-200 dark:text-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50">
        Copiado para a área de transferência!
    </div>

    <script>
        (function () {
            'use strict';

            const inputArea = document.getElementById('input-area');
            const outputArea = document.getElementById('output-area');
            const copyBtn = document.getElementById('copy-btn');
            const clearBtn = document.getElementById('clear-btn');
            const themeToggle = document.getElementById('theme-toggle');
            const toast = document.getElementById('toast');
            const charCounter = document.getElementById('char-count');
            const wordCounter = document.getElementById('word-count');
            const themeLabel = document.getElementById('theme-label');

            let toastTimer = null;

            // ---------- Utilidades ----------
            function debounce(fn, delay = 250) {
                let timeout;
                return function (...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            function showToast(message = 'Copiado para a área de transferência!') {
                toast.textContent = message;
                toast.classList.add('visible');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('visible');
                }, 2500);
            }

            function getPlainTextFromNode(node) {
                // Retorna texto puro (sem tags) do nó, preservando quebras de linha básicas
                const walker = document.createTreeWalker(
                    node,
                    NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT,
                    {
                        acceptNode(el) {
                            if (el.nodeType === Node.ELEMENT_NODE) {
                                const tag = el.tagName.toLowerCase();
                                if (['script', 'style', 'noscript'].includes(tag)) {
                                    return NodeFilter.FILTER_REJECT;
                                }
                                // Quebras de linha para block elements
                                if (['br', 'p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li', 'tr', 'pre'].includes(tag)) {
                                    return NodeFilter.FILTER_ACCEPT;
                                }
                                return NodeFilter.FILTER_ACCEPT;
                            }
                            return NodeFilter.FILTER_ACCEPT;
                        }
                    }
                );

                let text = '';
                let current;
                while ((current = walker.nextNode())) {
                    if (current.nodeType === Node.TEXT_NODE) {
                        text += current.nodeValue;
                    } else if (current.nodeType === Node.ELEMENT_NODE) {
                        const tag = current.tagName.toLowerCase();
                        if (tag === 'br') {
                            text += '\n';
                        } else if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li', 'tr', 'pre'].includes(tag)) {
                            text += '\n';
                        }
                    }
                }

                // Normaliza quebras de linha
                text = text.replace(/\r\n/g, '\n');
                text = text.replace(/\n{3,}/g, '\n\n');
                return text;
            }

            function countWordsFromNode(node) {
                const plain = getPlainTextFromNode(node).trim();
                if (!plain) return 0;
                const words = plain.split(/\s+/).filter(w => w.length > 0);
                return words.length;
            }

            function decodeHtmlEntities(str) {
                const textarea = document.createElement('textarea');
                textarea.innerHTML = str;
                return textarea.value;
            }

            // ---------- Tema ----------
            function applyTheme() {
                const saved = localStorage.getItem('theme');
                const isDark = saved === 'dark' || saved === null; // dark por padrão
                document.documentElement.classList.toggle('dark', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeLabel.textContent = isDark ? '🌙 Modo Escuro' : '☀️ Modo Claro';
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                document.documentElement.classList.toggle('dark', !isDark);
                localStorage.setItem('theme', isDark ? 'light' : 'dark');
                themeLabel.textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
            });

            applyTheme();

            // ---------- Conversão Rich Text → Markdown ----------
            function convertToMarkdown(html) {
                if (!html) return '';

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Remove elementos perigosos explicitamente
                doc.querySelectorAll('script, style, noscript').forEach(el => el.remove());

                function walk(node) {
                    let md = '';

                    for (let i = 0; i < node.childNodes.length; i++) {
                        const child = node.childNodes[i];

                        if (child.nodeType === Node.TEXT_NODE) {
                            // Decodifica entidades e preserva texto
                            let text = decodeHtmlEntities(child.nodeValue);
                            // Escape de caracteres Markdown que podem ser ambíguos fora de código
                            // (não escapa tudo para não quebrar conteúdo já formatado)
                            text = text.replace(/\\/g, '\\\\');
                            text = text.replace(/`/g, '\\`');
                            text = text.replace(/\*/g, '\\*');
                            text = text.replace(/_/g, '\\_');
                            text = text.replace(/~/g, '\\~');
                            text = text.replace(/\[/g, '\\[');
                            text = text.replace(/\]/g, '\\]');
                            text = text.replace(/\(/g, '\\(');
                            text = text.replace(/\)/g, '\\)');
                            text = text.replace(/#/g, '\\#');
                            text = text.replace(/\+/g, '\\+');
                            text = text.replace(/-/g, '\\-');
                            text = text.replace(/\|/g, '\\|');
                            md += text;
                            continue;
                        }

                        if (child.nodeType !== Node.ELEMENT_NODE) {
                            continue;
                        }

                        const tag = child.tagName.toLowerCase();

                        switch (tag) {
                            case 'h1': md += '\n# ' + walk(child).trim() + '\n\n'; break;
                            case 'h2': md += '\n## ' + walk(child).trim() + '\n\n'; break;
                            case 'h3': md += '\n### ' + walk(child).trim() + '\n\n'; break;
                            case 'h4': md += '\n#### ' + walk(child).trim() + '\n\n'; break;
                            case 'h5': md += '\n##### ' + walk(child).trim() + '\n\n'; break;
                            case 'h6': md += '\n###### ' + walk(child).trim() + '\n\n'; break;

                            case 'p':
                            case 'div': {
                                const inner = walk(child).trim();
                                md += inner ? '\n' + inner + '\n\n' : '\n\n';
                                break;
                            }

                            case 'br': md += '\n'; break;

                            case 'strong':
                            case 'b': md += '**' + walk(child).trim() + '**'; break;

                            case 'em':
                            case 'i': md += '*' + walk(child).trim() + '*'; break;

                            case 'a': {
                                const href = child.getAttribute('href') || '';
                                const textLink = walk(child).trim() || href;
                                md += '[' + textLink + '](' + href + ')';
                                break;
                            }

                            case 'code': {
                                // Código inline ou dentro de pre
                                const parent = child.parentElement;
                                const isInPre = parent && parent.tagName.toLowerCase() === 'pre';
                                if (isInPre) {
                                    md += walk(child);
                                } else {
                                    md += '`' + walk(child).trim() + '`';
                                }
                                break;
                            }

                            case 'pre': {
                                // Bloco de código
                                let codeContent = '';
                                const codeEl = child.querySelector('code');
                                if (codeEl) {
                                    // Pega texto do <code> preservando quebras e espaços
                                    codeContent = codeEl.innerText;
                                } else {
                                    codeContent = child.innerText;
                                }
                                // Remove possível \r\n
                                codeContent = codeContent.replace(/\r\n/g, '\n');
                                md += '\n```\n' + codeContent + '\n```\n\n';
                                break;
                            }

                            case 'ul': {
                                md += '\n' + walk(child) + '\n';
                                break;
                            }

                            case 'ol': {
                                // Lista ordenada: numera itens
                                let index = 0;
                                for (let j = 0; j < child.childNodes.length; j++) {
                                    const li = child.childNodes[j];
                                    if (li.nodeType === Node.ELEMENT_NODE && li.tagName.toLowerCase() === 'li') {
                                        index += 1;
                                        const liContent = walk(li).trim();
                                        md += '\n' + index + '. ' + liContent;
                                    }
                                }
                                md += '\n\n';
                                break;
                            }

                            case 'li': {
                                const liContent = walk(child).trim();
                                md += '\n- ' + liContent;
                                break;
                            }

                            case 'table': {
                                md += '\n' + tableToMarkdown(child) + '\n';
                                break;
                            }

                            case 'blockquote': {
                                const inner = walk(child).trim();
                                if (inner) {
                                    const lines = inner.split('\n');
                                    md += '\n' + lines.map(l => '> ' + l).join('\n') + '\n\n';
                                }
                                break;
                            }

                            case 'hr': md += '\n---\n\n'; break;

                            default: {
                                md += walk(child);
                                break;
                            }
                        }
                    }

                    return md;
                }

                function tableToMarkdown(tableEl) {
                    const rows = [];
                    const trList = Array.from(tableEl.querySelectorAll('tr'));

                    if (trList.length === 0) return '';

                    // Detecta cabeçalho: usa primeira linha com <th> ou primeira linha se existir
                    let headerRowIndex = -1;
                    for (let r = 0; r < trList.length; r++) {
                        const ths = trList[r].querySelectorAll('th');
                        if (ths.length > 0) {
                            headerRowIndex = r;
                            break;
                        }
                    }
                    if (headerRowIndex === -1 && trList.length > 0) {
                        headerRowIndex = 0; // fallback
                    }

                    // Coleta dados
                    const dataRows = [];
                    for (let r = 0; r < trList.length; r++) {
                        const cells = Array.from(trList[r].querySelectorAll('th, td'));
                        if (cells.length === 0) continue;
                        const cellTexts = cells.map(c => {
                            // Texto da célula sem quebras de linha excessivas
                            let t = c.innerText.replace(/\r\n/g, '\n').replace(/\n{2,}/g, ' ');
                            t = t.trim();
                            // Escape pipe
                            t = t.replace(/\|/g, '\\|');
                            return t;
                        });
                        if (r === headerRowIndex) {
                            rows.push('| ' + cellTexts.join(' | ') + ' |');
                            // separador
                            const sep = cellTexts.map(() => '---');
                            rows.push('| ' + sep.join(' | ') + ' |');
                        } else {
                            dataRows.push('| ' + cellTexts.join(' | ') + ' |');
                        }
                    }

                    // Adiciona linhas de dados
                    dataRows.forEach(x => rows.push(x));

                    return rows.join('\n');
                }

                let markdown = walk(doc.body);

                // Normalizações finais
                markdown = markdown.replace(/\r\n/g, '\n');
                markdown = markdown.replace(/\n{3,}/g, '\n\n');
                markdown = markdown.replace(/[ \t]+\n/g, '\n');
                markdown = markdown.trim();

                return markdown;
            }

            // ---------- Atualização e eventos ----------
            const debouncedUpdate = debounce(function updateOutput() {
                outputArea.classList.add('processing');
                requestAnimationFrame(() => {
                    const htmlContent = inputArea.innerHTML;
                    const markdown = convertToMarkdown(htmlContent);
                    outputArea.value = markdown;

                    // Estatísticas (baseadas no texto puro da entrada)
                    const plainText = getPlainTextFromNode(inputArea);
                    const charCount = plainText.length;
                    const wordCount = countWordsFromNode(inputArea);

                    charCounter.textContent = `Caracteres: ${charCount}`;
                    wordCounter.textContent = `Palavras: ${wordCount}`;

                    outputArea.classList.remove('processing');
                });
            }, 200);

            inputArea.addEventListener('input', debouncedUpdate);

            // Paste seguro
            inputArea.addEventListener('paste', (e) => {
                e.preventDefault();
                const clipboard = e.clipboardData || window.clipboardData;
                if (!clipboard) {
                    // fallback simples
                    document.execCommand('paste');
                    debouncedUpdate();
                    return;
                }

                const htmlData = clipboard.getData('text/html');
                const plainData = clipboard.getData('text/plain');

                if (htmlData) {
                    // Insere HTML formatado
                    document.execCommand('insertHTML', false, htmlData);
                } else if (plainData) {
                    // Insere texto puro
                    document.execCommand('insertText', false, plainData);
                }

                debouncedUpdate();
            });

            // Botões
            clearBtn.addEventListener('click', () => {
                inputArea.innerHTML = '';
                debouncedUpdate();
                inputArea.focus();
            });

            copyBtn.addEventListener('click', async () => {
                const text = outputArea.value;
                if (!text) {
                    showToast('Nada para copiar.');
                    return;
                }

                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                        showToast('Copiado para a área de transferência!');
                    } else {
                        // Fallback
                        outputArea.select();
                        const ok = document.execCommand('copy');
                        if (ok) {
                            showToast('Copiado para a área de transferência!');
                        } else {
                            showToast('Não foi possível copiar. Selecione e copie manualmente.');
                        }
                    }
                } catch (_) {
                    // Fallback
                    outputArea.select();
                    const ok = document.execCommand('copy');
                    if (ok) {
                        showToast('Copiado para a área de transferência!');
                    } else {
                        showToast('Não foi possível copiar. Selecione e copie manualmente.');
                    }
                }
            });

            // Atalhos de teclado
            document.addEventListener('keydown', (e) => {
                const isCtrlOrCmd = e.ctrlKey || e.metaKey;

                // Ctrl/Cmd + Shift + C → copiar
                if (isCtrlOrCmd && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    copyBtn.click();
                    return;
                }

                // Ctrl/Cmd + L → limpar
                if (isCtrlOrCmd && (e.key === 'L' || e.key === 'l')) {
                    e.preventDefault();
                    clearBtn.click();
                    return;
                }

                // Esc → focar saída
                if (e.key === 'Escape' && document.activeElement === inputArea) {
                    e.preventDefault();
                    outputArea.focus();
                    return;
                }
            });

            // Inicialização
            document.addEventListener('DOMContentLoaded', () => {
                inputArea.focus();
                debouncedUpdate();
            });
        })();
    </script>
</body>
</html>
